
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>My Account | ORQAVEN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      height: 76px;
      padding: 0 7%;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .back {
      font-size: 11px;
      letter-spacing: 2px;
      color: #aaa;
    }

    main {
      width: min(900px, 90%);
      margin: 65px auto;
    }

    .eyebrow {
      color: #888;
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 55px);
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .panel {
      background: #101010;
      border: 1px solid #292929;
      padding: 30px;
      margin-bottom: 22px;
    }

    .panel h2 {
      font-size: 17px;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .tabs {
      display: flex;
      gap: 25px;
      border-bottom: 1px solid #303030;
      margin-bottom: 25px;
    }

    .tab {
      background: none;
      border: none;
      color: #777;
      padding: 0 0 13px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .tab.active {
      color: white;
      border-bottom: 2px solid white;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 11px;
      margin: 18px 0 9px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      background: #080808;
      border: 1px solid #333;
      padding: 15px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #aaa;
    }

    .primary {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: white;
      color: black;
      border: none;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 11px;
    }

    .primary:disabled {
      opacity: .5;
      cursor: wait;
    }

    .message {
      font-size: 12px;
      line-height: 1.6;
      margin-top: 17px;
      color: #aaa;
      overflow-wrap: anywhere;
    }

    .message.error {
      color: #ff7777;
    }

    .message.success {
      color: #9bd5a2;
    }

    .hidden {
      display: none !important;
    }

    .account-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .email {
      color: #aaa;
      font-size: 13px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    .logout {
      background: transparent;
      color: white;
      border: 1px solid #444;
      padding: 12px 17px;
      cursor: pointer;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      background: #080808;
      border: 1px solid #292929;
      padding: 22px;
    }

    .stat-label {
      color: #888;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .order {
      border-top: 1px solid #292929;
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .order:last-child {
      padding-bottom: 0;
    }

    .order-id {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .order-date {
      color: #888;
      font-size: 11px;
    }

    .order-right {
      text-align: right;
    }

    .order-total {
      font-size: 13px;
      margin-bottom: 7px;
    }

    .status {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 1px;
    }

    .empty {
      color: #888;
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      border-top: 1px solid #242424;
      padding: 25px 7%;
      color: #777;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 80px;
    }

    @media(max-width: 600px) {
      main {
        margin: 45px auto;
      }

      .panel {
        padding: 22px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 16px;
      }

      .stat-value {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">ORQAVEN</a>
  <a href="index.html" class="back">← BACK TO SHOP</a>
</header>

<main>

  <section id="authSection">
    <div class="eyebrow">ORQAVEN / MEMBER AREA</div>
    <h1>MY ACCOUNT.</h1>
    <p class="subtitle">
      Welcome to your personal ORQAVEN account.
      Sign in or create your account.
    </p>

    <div class="panel">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          LOGIN
        </button>
        <button class="tab" id="signupTab" type="button">
          CREATE ACCOUNT
        </button>
      </div>

      <form id="authForm">
        <label for="email">EMAIL ADDRESS</label>
        <input
          id="email"
          type="email"
          placeholder="your@email.com"
          autocomplete="email"
          required
        >

        <label for="password">PASSWORD</label>
        <input
          id="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button class="primary" id="submitButton" type="submit">
          SIGN IN →
        </button>

        <p id="authMessage" class="message" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section id="dashboardSection" class="hidden">
    <div class="eyebrow">ORQAVEN / PERSONAL AREA</div>
    <h1>WELCOME BACK.</h1>

    <div class="panel">
      <div class="account-top">
        <div>
          <h2>YOUR ACCOUNT</h2>
          <p class="email" id="accountEmail"></p>
        </div>
        <button class="logout" id="logoutButton" type="button">
          LOG OUT
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">ORDERS</div>
          <div class="stat-value" id="orderCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">TOTAL SPENT</div>
          <div class="stat-value" id="totalSpent">0,00 €</div>
        </div>
      </div>

      <p id="dashboardMessage" class="message" aria-live="polite"></p>
    </div>

    <div class="panel">
      <h2>ORDER HISTORY</h2>
      <div id="ordersList">
        <p class="empty">Loading your orders...</p>
      </div>
    </div>
  </section>

</main>

<footer>
  ORQAVEN © 2026 — BE DIFFERENT.
</footer>

<script type="module">
  import { supabase } from './supabase.js';

  const authSection = document.getElementById('authSection');
  const dashboardSection = document.getElementById('dashboardSection');

  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
  const authForm = document.getElementById('authForm');
  const submitButton = document.getElementById('submitButton');

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const authMessage = document.getElementById('authMessage');
  const dashboardMessage = document.getElementById('dashboardMessage');

  const accountEmail = document.getElementById('accountEmail');
  const orderCount = document.getElementById('orderCount');
  const totalSpent = document.getElementById('totalSpent');
  const ordersList = document.getElementById('ordersList');

  const logoutButton = document.getElementById('logoutButton');

  let authMode = 'login';
  let currentUser = null;

  function showMessage(element, message, type = '') {
    element.textContent = message;
    element.className = 'message' + (type ? ' ' + type : '');
  }

  function setAuthMode(mode) {
    authMode = mode;

    loginTab.classList.toggle('active', mode === 'login');
    signupTab.classList.toggle('active', mode === 'signup');

    submitButton.textContent =
      mode === 'login' ? 'SIGN IN →' : 'CREATE ACCOUNT →';

    passwordInput.autocomplete =
      mode === 'login' ? 'current-password' : 'new-password';

    showMessage(authMessage, '');
  }

  loginTab.addEventListener('click', () => setAuthMode('login'));
  signupTab.addEventListener('click', () => setAuthMode('signup'));

  function showAuth() {
    currentUser = null;
    authSection.classList.remove('hidden');
    dashboardSection.classList.add('hidden');
  }

  function showDashboard(user) {
    currentUser = user;
    authSection.classList.add('hidden');
    dashboardSection.classList.remove('hidden');

    accountEmail.textContent = user.email || 'No email available';

    loadOrders(user);
  }

  authForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    submitButton.disabled = true;
    showMessage(authMessage, 'Please wait...');

    try {
      if (authMode === 'signup') {
        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        if (error) throw error;

        if (data.session && data.user) {
          showMessage(authMessage, 'Account created successfully.', 'success');
          showDashboard(data.user);
        } else {
          showMessage(
            authMessage,
            'Account created. Please follow the email confirmation instructions if confirmation is enabled.',
            'success'
          );
        }

      } else {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        showMessage(authMessage, 'Login successful.', 'success');
        showDashboard(data.user);
      }

    } catch (error) {
      showMessage(
        authMessage,
        error.message || 'Something went wrong. Please try again.',
        'error'
      );
    } finally {
      submitButton.disabled = false;
    }
  });

  async function loadOrders(user) {
    ordersList.innerHTML =
      '<p class="empty">Loading your orders...</p>';

    showMessage(dashboardMessage, '');

    try {
      const { data, error } = await supabase
        .from('orders')
        .select('id,status,total,created_at')
        .eq('customer_id', user.id)
        .order('created_at', { ascending: false });

      if (error) throw error;

      const orders = data || [];

      orderCount.textContent = orders.length;

      const spent = orders.reduce((sum, order) => {
        const amount = Number(order.total);
        return sum + (Number.isFinite(amount) ? amount : 0);
      }, 0);

      totalSpent.textContent = spent.toLocaleString('de-DE', {
        style: 'currency',
        currency: 'EUR'
      });

      if (orders.length === 0) {
        ordersList.innerHTML =
          '<p class="empty">You have no orders yet. Your orders will appear here after your first purchase.</p>';
        return;
      }

      ordersList.innerHTML = '';

      orders.forEach((order) => {
        const item = document.createElement('div');
        item.className = 'order';

        const left = document.createElement('div');

        const orderId = document.createElement('div');
        orderId.className = 'order-id';
        orderId.textContent = 'ORDER #' + String(order.id).slice(0, 8).toUpperCase();

        const date = document.createElement('div');
        date.className = 'order-date';

        date.textContent = order.created_at
          ? new Date(order.created_at).toLocaleDateString('de-DE')
          : 'Date unavailable';

        left.append(orderId, date);

        const right = document.createElement('div');
        right.className = 'order-right';

        const amount = document.createElement('div');
        amount.className = 'order-total';

        const numericTotal = Number(order.total);
        amount.textContent = Number.isFinite(numericTotal)
          ? numericTotal.toLocaleString('de-DE', {
              style: 'currency',
              currency: 'EUR'
            })
          : '—';

        const status = document.createElement('div');
        status.className = 'status';
        status.textContent = String(order.status || 'PROCESSING').toUpperCase();

        right.append(amount, status);
        item.append(left, right);
        ordersList.appendChild(item);
      });

    } catch (error) {
      ordersList.innerHTML =
        '<p class="empty">Your orders could not be loaded. Please try again later.</p>';

      showMessage(
        dashboardMessage,
        error.message || 'Could not load orders.',
        'error'
      );
    }
  }

  logoutButton.addEventListener('click', async () => {
    logoutButton.disabled = true;

    try {
      const { error } = await supabase.auth.signOut();
      if (error) throw error;

      showAuth();
      setAuthMode('login');

    } catch (error) {
      showMessage(
        dashboardMessage,
        error.message || 'Logout failed.',
        'error'
      );
    } finally {
      logoutButton.disabled = false;
    }
  });

  // Restore an existing login when the page is reopened.
  const { data: { session }, error: sessionError } =
    await supabase.auth.getSession();

  if (sessionError) {
    showAuth();
    showMessage(authMessage, sessionError.message, 'error');
  } else if (session?.user) {
    showDashboard(session.user);
  } else {
    showAuth();
  }

  // Keep the page in sync if the login state changes.
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session?.user) {
      if (currentUser?.id !== session.user.id) {
        showDashboard(session.user);
      }
    } else {
      showAuth();
    }
  });
</script>

</body>
</html>
